# Incollalo in https://api.slack.com/apps → Create New App → From a manifest
display_information:
  name: Ticket Backoffice
  description: Richieste degli agenti al backoffice Gromia
  background_color: "#2f5d50"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Ticket Backoffice
    always_online: true
  slash_commands:
    - command: /ticket
      description: Apri una richiesta al backoffice (oppure "/ticket miei")
      usage_hint: "[oggetto] | miei | aiuto"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.customize   # gli inoltri compaiono a nome di chi ha scritto
      - im:write
      - im:history
      - channels:history
      - groups:history         # se il canale backoffice e' privato
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
